name: Deal Radar

# Checks Amazon Egypt Resale (used) offers and sends Telegram alerts.
#
# Scheduling reality:
#  - GitHub Actions cron is best-effort, not real-time: runs can start a few
#    minutes late during peak load.
#  - "*/5" (every 5 minutes) means ~8,900 runs/month. On a PUBLIC repository
#    Actions minutes are free; on a PRIVATE repository the free tier is
#    2,000 minutes/month, so this interval needs the repo to be public
#    (or a paid plan).

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:          # allows manual "Run workflow" button

concurrency:
  group: deal-radar
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restore database
        uses: actions/cache@v4
        with:
          path: data/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: |
            radar-db-

      - name: Run Deal Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python run.py

      - name: Upload logs and database snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ github.run_id }}
          path: |
            data/radar.log
            data/radar.db
          retention-days: 7
          if-no-files-found: ignore
